<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bloco na Rua — Carnival Arch logo">
  <title>Bloco na Rua — Carnival Arch</title>
  <desc>A stylized arch over a street — the passage every bloco walks through to start the party.</desc>

  <defs>
    <linearGradient id="lbl-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="lbl-arch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#FF3D81"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#FF3D81"/>
    </linearGradient>
  </defs>

  <!-- Dark velvet backdrop (night street) -->
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#lbl-night)"/>

  <!-- Distant street perspective lines -->
  <g stroke="#A78BFA" stroke-opacity="0.18" stroke-linecap="round">
    <line x1="40"  y1="220" x2="118" y2="180" stroke-width="2"/>
    <line x1="216" y1="220" x2="138" y2="180" stroke-width="2"/>
    <line x1="64"  y1="230" x2="118" y2="200" stroke-width="2"/>
    <line x1="192" y1="230" x2="138" y2="200" stroke-width="2"/>
  </g>

  <!-- Arch silhouette (the street entrance) -->
  <path d="M 36 224
           L 36 132
           A 92 92 0 0 1 220 132
           L 220 224
           L 188 224
           L 188 144
           A 60 60 0 0 0 68 144
           L 68 224 Z"
        fill="url(#lbl-arch)"/>

  <!-- Arch outline highlight -->
  <path d="M 36 132
           A 92 92 0 0 1 220 132"
        fill="none" stroke="#FBBF24" stroke-width="3"/>

  <!-- Pillar bases -->
  <rect x="28"  y="218" width="24" height="14" rx="3" fill="#5B21B6"/>
  <rect x="204" y="218" width="24" height="14" rx="3" fill="#5B21B6"/>

  <!-- Confetti streaming through the archway -->
  <g>
    <circle cx="84"  cy="178" r="4" fill="#FBBF24"/>
    <circle cx="118" cy="166" r="3" fill="#FF3D81"/>
    <circle cx="146" cy="172" r="4" fill="#FFFFFF"/>
    <circle cx="172" cy="158" r="3" fill="#FBBF24"/>
    <rect  x="100" y="190" width="6" height="6" rx="1.5" fill="#FF3D81" transform="rotate(20 103 193)"/>
    <rect  x="150" y="188" width="6" height="6" rx="1.5" fill="#FBBF24" transform="rotate(-20 153 191)"/>
    <rect  x="124" y="200" width="5" height="5" rx="1"  fill="#FFFFFF" transform="rotate(15 126 202)"/>
  </g>

  <!-- Three small streamers above the arch -->
  <g stroke-linecap="round" stroke-width="3" fill="none">
    <path d="M 88 60 Q 110 40 132 60"  stroke="#FBBF24"/>
    <path d="M 124 50 Q 146 30 168 50" stroke="#FF3D81"/>
    <path d="M 102 72 Q 124 52 146 72" stroke="#A78BFA"/>
  </g>

  <!-- Tiny stars -->
  <g fill="#FBBF24">
    <circle cx="56"  cy="80"  r="1.5"/>
    <circle cx="200" cy="74"  r="1.5"/>
    <circle cx="220" cy="100" r="1.2"/>
    <circle cx="40"  cy="104" r="1.2"/>
  </g>
</svg>
