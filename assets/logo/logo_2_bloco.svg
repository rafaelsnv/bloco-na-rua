<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Bloco na Rua — Bloco Procession logo">
  <title>Bloco na Rua — Procession</title>
  <desc>Three figures marching together — the community at the heart of every street block.</desc>

  <defs>
    <linearGradient id="lbl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FAFAF9"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
  </defs>

  <!-- Soft background tile (transparent when removed) -->
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#lbl-bg)"/>

  <!-- Baseline "street" -->
  <rect x="20" y="200" width="216" height="14" rx="7" fill="#7C3AED"/>
  <rect x="20" y="200" width="216" height="6"  rx="3" fill="#A78BFA" opacity="0.6"/>

  <!-- Motion arcs behind figures -->
  <g fill="none" stroke="#FF3D81" stroke-opacity="0.55" stroke-linecap="round" stroke-width="4">
    <path d="M 38 96  Q 70 70 100 96"/>
    <path d="M 156 96 Q 186 70 218 96"/>
  </g>

  <!-- Figure LEFT (gold body, violet head) -->
  <g>
    <circle cx="74" cy="92"  r="20" fill="#5B21B6"/>
    <circle cx="74" cy="92"  r="20" fill="none" stroke="#FBBF24" stroke-width="3"/>
    <path d="M 44 200
             Q 44 156 74 156
             Q 104 156 104 200 Z"
          fill="#FBBF24"/>
    <!-- Arms -->
    <path d="M 50 168 Q 38 178 42 192" stroke="#FBBF24" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 98 168 Q 110 178 106 192" stroke="#FBBF24" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Figure CENTER (violet body, tallest, gold head) -->
  <g>
    <circle cx="128" cy="78" r="24" fill="#FBBF24"/>
    <circle cx="128" cy="78" r="24" fill="none" stroke="#5B21B6" stroke-width="3"/>
    <path d="M 92 200
             Q 92 152 128 152
             Q 164 152 164 200 Z"
          fill="#7C3AED"/>
    <!-- Arms raised in celebration -->
    <path d="M 100 162 Q 86 140 92 124" stroke="#7C3AED" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 156 162 Q 170 140 164 124" stroke="#7C3AED" stroke-width="11" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Figure RIGHT (magenta body, violet head) -->
  <g>
    <circle cx="182" cy="92" r="20" fill="#5B21B6"/>
    <circle cx="182" cy="92" r="20" fill="none" stroke="#FF3D81" stroke-width="3"/>
    <path d="M 152 200
             Q 152 156 182 156
             Q 212 156 212 200 Z"
          fill="#FF3D81"/>
    <path d="M 158 168 Q 146 178 150 192" stroke="#FF3D81" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 206 168 Q 218 178 214 192" stroke="#FF3D81" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Confetti dots floating above -->
  <g>
    <circle cx="40"  cy="50" r="4" fill="#FF3D81"/>
    <circle cx="70"  cy="36" r="3" fill="#FBBF24"/>
    <circle cx="110" cy="48" r="4" fill="#7C3AED"/>
    <circle cx="148" cy="36" r="3" fill="#FF3D81"/>
    <circle cx="186" cy="50" r="4" fill="#FBBF24"/>
    <circle cx="218" cy="40" r="3" fill="#7C3AED"/>
  </g>
</svg>
